<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">
<title>Codex PROVE 当前四角色路由与证据审核</title>
<desc>Direct 无子代理；Controller-only 由 Astra 分析。复杂执行按需选择 Sol 专项、Terra 常规或 Luna 批处理，每个 worker 独立向同一个 Controller 返回证据，Host 最终交付。</desc>
