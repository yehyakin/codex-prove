<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">
<title>Codex PROVE：Astra 主控，按需选择 Sol、Terra、Luna</title>
<desc>单一 Controller 分配有界任务，三个可选 worker 返回文件、Diff 与测试证据。实线派发任务，虚线返回证据；不是固定团队。</desc>
<defs>
  <marker id="task-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF6B3D"/></marker>
  <marker id="evidence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8FA7FF"/></marker>
</defs>
<rect width="1200" height="420" fill="#0B1020"/>
<rect x="28" y="24" width="1144" height="372" rx="24" fill="#111A30" stroke="#9AA6B8" stroke-opacity="0.35" stroke-width="2"/>
<text x="64" y="85" text-anchor="start" fill="#F7F3E8" font-size="38" font-weight="800">CODEX PROVE</text>
<text x="64" y="124" text-anchor="start" fill="#65D6C4" font-size="24" font-weight="600">规划 · 路由 · 所有权 · 验证 · 证据</text>
<path d="M64 146H586" stroke="#9AA6B8" stroke-opacity="0.3" stroke-width="2"/>
<text x="64" y="202" text-anchor="start" fill="#FF6B3D" font-size="34" font-weight="800">让主控做判断</text>
<text x="64" y="248" text-anchor="start" fill="#FF6B3D" font-size="34" font-weight="800">让合适的模型做执行</text>
<text x="64" y="289" text-anchor="start" fill="#F7F3E8" font-size="22" font-weight="600">小任务 Direct · 复杂任务按需编排</text>
<text x="64" y="342" text-anchor="start" fill="#65D6C4" font-size="22" font-weight="600">FILES · DIFF · TEST</text>
<text x="64" y="373" text-anchor="start" fill="#9AA6B8" font-size="20" font-weight="600">真实证据 → Controller 审核 → Host 交付</text>
<text x="900" y="76" text-anchor="middle" fill="#9AA6B8" font-size="22" font-weight="600">一个主控 · 三类可选执行者</text>
<path id="task-path-1" data-flow="task" data-from="prove-controller" data-to="prove-specialist-worker" d="M876 212C876 240 700 236 700 274" fill="none" stroke="#FF6B3D" stroke-width="3" marker-end="url(#task-arrow)"/>
<path id="evidence-path-1" data-flow="evidence" data-from="prove-specialist-worker" data-to="prove-controller" d="M760 274C760 244 934 242 934 212" fill="none" stroke="#8FA7FF" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#evidence-arrow)"/>
<path id="task-path-2" data-flow="task" data-from="prove-controller" data-to="prove-complex-worker" d="M876 212C876 240 872 236 872 274" fill="none" stroke="#FF6B3D" stroke-width="3" marker-end="url(#task-arrow)"/>
<path id="evidence-path-2" data-flow="evidence" data-from="prove-complex-worker" data-to="prove-controller" d="M932 274C932 244 934 242 934 212" fill="none" stroke="#8FA7FF" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#evidence-arrow)"/>
<path id="task-path-3" data-flow="task" data-from="prove-controller" data-to="prove-efficient-worker" d="M876 212C876 240 1044 236 1044 274" fill="none" stroke="#FF6B3D" stroke-width="3" marker-end="url(#task-arrow)"/>
<path id="evidence-path-3" data-flow="evidence" data-from="prove-efficient-worker" data-to="prove-controller" d="M1104 274C1104 244 934 242 934 212" fill="none" stroke="#8FA7FF" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#evidence-arrow)"/>
<g id="prove-controller" data-model="gpt-6-astra"><rect x="798" y="112" width="214" height="100" rx="14" fill="#0B1020" stroke="#FF6B3D" stroke-width="2"/><text x="905" y="150" text-anchor="middle" fill="#FF6B3D" font-size="25" font-weight="800">GPT-6 ASTRA</text><text x="905" y="180" text-anchor="middle" fill="#F7F3E8" font-size="20" font-weight="600">Controller · high</text></g>
<g id="prove-specialist-worker" data-model="gpt-6-sol"><rect x="656" y="274" width="148" height="82" rx="14" fill="#0B1020" stroke="#8FA7FF" stroke-width="2"/><text x="730" y="302" text-anchor="middle" fill="#8FA7FF" font-size="24" font-weight="800">SOL</text><text x="730" y="328" text-anchor="middle" fill="#F7F3E8" font-size="18" font-weight="600">GPT-6 · high</text></g>
<text x="730" y="380" text-anchor="middle" fill="#8FA7FF" font-size="20" font-weight="600">专项攻坚</text>
<g id="prove-complex-worker" data-model="gpt-5.6-terra"><rect x="828" y="274" width="148" height="82" rx="14" fill="#0B1020" stroke="#F7F3E8" stroke-width="2"/><text x="902" y="302" text-anchor="middle" fill="#F7F3E8" font-size="24" font-weight="800">TERRA</text><text x="902" y="328" text-anchor="middle" fill="#F7F3E8" font-size="18" font-weight="600">GPT-5.6 · high</text></g>
<text x="902" y="380" text-anchor="middle" fill="#F7F3E8" font-size="20" font-weight="600">常规执行</text>
<g id="prove-efficient-worker" data-model="gpt-6-luna"><rect x="1000" y="274" width="148" height="82" rx="14" fill="#0B1020" stroke="#65D6C4" stroke-width="2"/><text x="1074" y="302" text-anchor="middle" fill="#65D6C4" font-size="24" font-weight="800">LUNA</text><text x="1074" y="328" text-anchor="middle" fill="#F7F3E8" font-size="18" font-weight="600">GPT-6 · max</text></g>
<text x="1074" y="380" text-anchor="middle" fill="#65D6C4" font-size="20" font-weight="600">机械批量</text>
</svg>
